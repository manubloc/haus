:root{--bg:#f4eee3;--bg2:#ece3d2;--surface:#fffdf8;--ink:#2a2924;--ink-2:#6a6659;--line:#ddd3c0;--accent:#5f6a37;--accent-2:#7b8750;--accent-ink:#fff;--soft:#eef0df;--bad:#a63a2c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#181712;--bg2:#211f18;--surface:#24231c;--ink:#f0ede4;--ink-2:#b9b5a6;--line:#4a473a;--accent:#b7c388;--accent-2:#cdd7a3;--accent-ink:#1c200f;--soft:#30351f;--bad:#f0907f;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px 16px;color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(900px 520px at 12% -8%,var(--bg2),transparent 62%),radial-gradient(760px 480px at 108% 108%,var(--bg2),transparent 60%),var(--bg)}
.karte{width:100%;max-width:392px;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:34px 28px 26px;text-align:center;box-shadow:0 1px 2px rgba(70,56,30,.06),0 30px 60px -34px rgba(70,56,30,.45)}
.herz{width:58px;height:58px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent)}
.herz svg{width:26px;height:26px}
h1{margin:0;font-family:'Lora',Georgia,'Times New Roman',serif;font-weight:500;line-height:1}
h1 .h{display:block;font-size:44px;letter-spacing:-.01em}
h1 .s{display:block;font-style:italic;font-size:33px;color:var(--accent);margin-top:2px}
.zier{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 10px;color:var(--accent-2)}
.zier::before,.zier::after{content:"";height:1px;width:46px;background:var(--line)}
.zier svg{width:12px;height:12px}
.gruss{margin:0 0 22px;font-size:12.5px;letter-spacing:.2em;color:var(--ink-2);text-transform:uppercase}
form{display:grid;gap:14px;text-align:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.feld{display:grid;grid-template-columns:22px minmax(0,1fr) 40px;align-items:center;gap:8px;border:1px solid var(--line);border-radius:16px;padding:4px 6px 4px 14px;background:var(--surface);transition:border-color .15s ease,box-shadow .15s ease}
.feld:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.feld > svg{width:18px;height:18px;color:var(--ink-2)}
.feld input{width:100%;min-width:0;font:inherit;color:inherit;background:transparent;border:0;outline:0;padding:11px 0}
.feld input::placeholder{color:var(--ink-2);opacity:.75}
.auge{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--ink-2);cursor:pointer;display:grid;place-items:center}
.auge svg{width:19px;height:19px}
.auge[aria-pressed="true"]{color:var(--accent)}
.merken{display:flex;gap:9px;align-items:center;font-size:14.5px;color:var(--ink-2);cursor:pointer}
.merken input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.los{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font:inherit;font-weight:600;font-size:16.5px;border:0;border-radius:999px;padding:14px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:filter .15s ease,transform .1s ease}
.los:hover{filter:brightness(1.07)} .los:active{transform:translateY(1px)}
.los svg{width:18px;height:18px}
.los[disabled]{opacity:.65;cursor:progress}
button:focus-visible,.merken input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{min-height:20px;margin:0;font-size:14px;color:var(--bad);text-align:center}
.fuss{margin:14px 0 0;font-size:12.5px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="karte">
  <div class="herz" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.6C6.2 16.3 3.5 13.2 3.5 9.7A4.4 4.4 0 0 1 12 8a4.4 4.4 0 0 1 8.5 1.7c0 3.5-2.7 6.6-8.5 10.9Z"/></svg></div>
  <h1><span class="h">Home</span><span class="s">Sweet Home</span></h1>
  <div class="zier" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.6C6.2 16.3 3.5 13.2 3.5 9.7A4.4 4.4 0 0 1 12 8a4.4 4.4 0 0 1 8.5 1.7c0 3.5-2.7 6.6-8.5 10.9Z"/></svg></div>
  <p class="gruss">Schön, dass du da bist.</p>
  <form id="f" autocomplete="on">
    <label class="sr" for="pw">Passwort</label>
    <div class="feld">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2.2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
      <input type="password" id="pw" name="password" placeholder="Passwort" autocomplete="current-password" required autofocus>
      <button type="button" class="auge" id="auge" aria-label="Passwort anzeigen" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
    </div>
    <label class="merken"><input type="checkbox" id="mk" checked><span>Angemeldet bleiben</span></label>
    <button type="submit" class="los" id="go"><span id="got">Einloggen</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <p id="msg" role="alert"></p>
  </form>
  <p class="fuss">Privater Bereich. Der Inhalt ist verschlüsselt.</p>
</main>
<script>
(function () {
  var ITER = 600000, LS = 'hausakte-schluessel', f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go'), got = document.getElementById('got'), auge = document.getElementById('auge'), feld = document.getElementById('pw');
  var daten = null;
  function hole() { return daten || (daten = fetch('daten.bin', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('laden'); return r.arrayBuffer(); })); }
  function b64(buf) { var s = '', a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function unb64(t) { var s = atob(t), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function schluessel(pw, salt) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: ITER }, k, 256);
    });
  }
  function oeffne(roh, buf) {
    var a = new Uint8Array(buf), kopf = a.slice(0, 3), iv = a.slice(19, 31);
    return crypto.subtle.importKey('raw', roh, 'AES-GCM', false, ['decrypt']).then(function (k) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv, additionalData: kopf }, k, a.slice(31));
    }).then(function (zip) {
      return new Response(new Blob([zip]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    }).then(function (t) {
      var d = JSON.parse(t), html = d.html;
      Object.keys(d.files).forEach(function (n) {
        var url = URL.createObjectURL(new Blob([unb64(d.files[n])], { type: /\.png$/.test(n) ? 'image/png' : 'image/jpeg' }));
        html = html.split(n).join(url);
      });
      document.open(); document.write(html); document.close();
    });
  }
  function fehler(t) { msg.textContent = t; go.disabled = false; got.textContent = 'Einloggen'; }
  auge.addEventListener('click', function () { var an = feld.type === 'password'; feld.type = an ? 'text' : 'password'; auge.setAttribute('aria-pressed', String(an)); auge.setAttribute('aria-label', an ? 'Passwort verbergen' : 'Passwort anzeigen'); feld.focus(); });
  if (!(window.crypto && crypto.subtle && window.DecompressionStream)) { fehler('Dieser Browser ist zu alt für die Seite. Bitte einen aktuellen Browser nutzen.'); go.disabled = true; return; }
  // gemerkter Schlüssel: gleich öffnen
  var alt = null; try { alt = localStorage.getItem(LS); } catch (e) { }
  if (alt) hole().then(function (buf) { return oeffne(unb64(alt), buf); }).catch(function () { try { localStorage.removeItem(LS); } catch (e) { } });
  f.addEventListener('submit', function (ev) {
    ev.preventDefault(); msg.textContent = ''; go.disabled = true; got.textContent = 'Einen Moment …';
    var pw = document.getElementById('pw').value, merken = document.getElementById('mk').checked;
    hole().then(function (buf) {
      return schluessel(pw, new Uint8Array(buf).slice(3, 19)).then(function (roh) {
        return oeffne(roh, buf).then(function () { if (merken) { try { localStorage.setItem(LS, b64(roh)); } catch (e) { } } });
      });
    }).catch(function (e) { fehler(e && e.message === 'laden' ? 'Die Daten ließen sich nicht laden. Bitte später noch einmal versuchen.' : 'Das Passwort stimmt nicht.'); });
  });
})();
</script>
</body>
</html>
